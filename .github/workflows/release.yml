name: Build & Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-version:
    name: Verify Tag & Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check-version.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify Version Match
        id: check-version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Tag Version: $TAG"
          echo "Package Version: $PKG_VERSION"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch! Git tag ($TAG) does not match package.json version ($PKG_VERSION)."
            echo "Please update the version in package.json to match the tag before releasing."
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

  build-and-release:
    name: Build Multi-Arch Binaries & Release
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Run Tests & Build
        run: |
          bun test
          bun run build

      - name: Compile Standalone Binaries
        run: |
          mkdir -p release-assets

          echo "Compiling for Linux x64..."
          bun build --compile --minify --target=bun-linux-x64 ./src/main.ts --outfile ./bin-linux-x64/textc
          tar -czf release-assets/textc-linux-x64.tar.gz -C ./bin-linux-x64 textc

          echo "Compiling for Linux ARM64..."
          bun build --compile --minify --target=bun-linux-arm64 ./src/main.ts --outfile ./bin-linux-arm64/textc
          tar -czf release-assets/textc-linux-arm64.tar.gz -C ./bin-linux-arm64 textc

          echo "Compiling for macOS x64..."
          bun build --compile --minify --target=bun-darwin-x64 ./src/main.ts --outfile ./bin-darwin-x64/textc
          tar -czf release-assets/textc-darwin-x64.tar.gz -C ./bin-darwin-x64 textc

          echo "Compiling for macOS ARM64 (Apple Silicon)..."
          bun build --compile --minify --target=bun-darwin-arm64 ./src/main.ts --outfile ./bin-darwin-arm64/textc
          tar -czf release-assets/textc-darwin-arm64.tar.gz -C ./bin-darwin-arm64 textc

          echo "Compiling for Windows x64..."
          bun build --compile --minify --target=bun-windows-x64 ./src/main.ts --outfile ./bin-windows-x64/textc.exe
          zip -j release-assets/textc-windows-x64.zip ./bin-windows-x64/textc.exe

          echo "Packaging Node-compatible bundle..."
          tar -czf release-assets/textc-dist.tar.gz -C ./dist textc.js

      - name: Generate Checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          name: 'textc v${{ needs.verify-version.outputs.version }}'
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to npm (bundled textc.js only)
    needs: [verify-version, build-and-release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: NPM_TOKEN
    permissions:
      contents: read
      id-token: write   # required for npm OIDC trusted publishing
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (npm registry + trusted publishing support)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Install Dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Assemble npm package (bundled textc.js only)
        run: |
          mkdir -p npm-package/dist
          cp dist/textc.js npm-package/dist/textc.js
          node -e "
            const pkg = require('./package.json');
            const out = {
              name: pkg.name,
              version: pkg.version,
              description: pkg.description,
              license: pkg.license,
              author: pkg.author,
              repository: pkg.repository,
              bugs: pkg.bugs,
              homepage: pkg.homepage,
              publishConfig: pkg.publishConfig,
              bin: pkg.bin,
              files: ['dist', 'README.md', 'LICENSE'],
              keywords: pkg.keywords,
              engines: pkg.engines
            };
            require('fs').writeFileSync('npm-package/package.json', JSON.stringify(out, null, 2));
          "
          cp README.md npm-package/README.md 2>/dev/null || true
          cp LICENSE npm-package/LICENSE 2>/dev/null || true

      - name: Publish to npm
        working-directory: npm-package
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
